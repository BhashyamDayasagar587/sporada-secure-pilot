name: traffic-edge-runtime
version: 2026.09.11-v3
contractVersion: v1
architectures: [amd64]
hardwareProfile: intel-285h
runtimeBase:
  image: apexfabric-intel-traffic-runtime-base:intel-285h-2026.08.24-v1
  digest: sha256:9b285a691f09e6d9a0a2bce762bee72e8e340dca167b21416907e0f170d0adc2
  deployment: build-parent-only
capabilities:
  apps: [vehicle_counting, pedestrian_counting, anpr, fire_smoke_detection]
models:
  delivery: baked-in
  root: /models/traffic/openvino
  metadata: /opt/traffic-pilot/delivery/apexfabric-v1/intel-285h/traffic-pilot/model-registry.yaml
configuration:
  desiredStatePath: /configs/desired_state.json
  hotReload:
    enabled: true
    pollSeconds: 2
    strategy: transactional-child-restart
    revisionPolicy: nondecreasing
    mountPath: /configs
    kubernetesSubPathSupported: false
secrets:
  root: /run/secrets/apexfabric
  referenceFormat: file:/run/secrets/apexfabric/<camera-id>.rtsp
runtimePlan:
  compiler: python -m traffic_pilot_runtime.solution_image_entrypoint
  output: /plans/traffic.runtime_plan.json
network:
  port: 8080
  hostNetworkRequired: false
endpoints:
  health: /healthz
  readiness: /readyz
  metrics: /metrics
  events: /events
  snapshots: /snapshots/<state-relative-path>
metricsFormat: application/json
eventProtocol: sse
process:
  uid: 10001
  gid: 10001
  readOnlyRootSupported: true
resources:
  cpuRequest: "8"
  memoryRequest: 16Gi
  maxCameraStreams: 26
accelerators:
  - intel-igpu
  - intel-npu
devices:
  - /dev/dri
  - /dev/accel
storage:
  persistentVolumes:
    - mountPath: /state
      purpose: event and snapshot storage served by /events and /snapshots
  temporaryPaths: [/plans, /tmp/apexfabric]
externalDependencies: []
ui:
  included: false
